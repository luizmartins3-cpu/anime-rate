<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Anime Rate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="view/css/style.css">
    <link rel="stylesheet" href="view/css/components.css">
    <style>
        .profile-header {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
            position: relative;
            overflow: hidden;
            border: 4px solid var(--bg-card);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .edit-avatar-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 0.8rem;
            padding: 0.3rem 0;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: center;
            border: none;
        }

        .profile-avatar:hover .edit-avatar-btn {
            opacity: 1;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 500px;
            border-radius: var(--border-radius);
            padding: 2rem;
            position: relative;
            border: 1px solid var(--glass-border);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-modal {
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: var(--accent-color);
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            max-height: 350px;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .avatar-option {
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
        }

        .avatar-option:hover {
            transform: scale(1.1);
            border-color: var(--primary-color);
        }

        .avatar-option.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
        }

        .avatar-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            text-align: center;
            border-bottom: 4px solid var(--primary-color);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            display: block;
        }

        .stat-label {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .recent-reviews {
            margin-top: 3rem;
        }

        @media (max-width: 600px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="fade-in">
        <main class="container">
            <div class="profile-header">
                <div class="profile-avatar" id="profile-avatar-container">
                    <i class="fas fa-user"></i>
                    <button class="edit-avatar-btn" id="open-avatar-modal">Alterar Foto</button>
                </div>
                <div class="profile-info">
                    <h1>Otaku Explorer</h1>
                    <p style="color: var(--text-muted);">Membro desde 2024</p>
                </div>
            </div>

            <!-- Avatar Selection Modal -->
            <div class="modal" id="avatar-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Escolha seu Avatar</h2>
                        <i class="fas fa-times close-modal" id="close-avatar-modal"></i>
                    </div>
                    <div class="avatar-grid" id="avatar-options-grid">
                        <!-- Avatars will be rendered here -->
                    </div>
                    <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                        <button class="btn btn-primary" id="save-avatar-btn">Salvar Alteração</button>
                    </div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="count-favorites">0</span>
                    <span class="stat-label">Favoritos</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="count-reviews">0</span>
                    <span class="stat-label">Avaliações</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="user-rank">Iniciante</span>
                    <span class="stat-label">Seu Rank</span>
                </div>
            </div>

            <section class="recent-reviews">
                <h2 class="section-title">Minhas Avaliações Recentes</h2>
                <div id="user-reviews-list">
                    <!-- Reviews will be rendered here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="view/js/data.js"></script>
    <script src="view/js/auth.js"></script>
    <script src="view/js/common.js"></script>
    <script src="view/js/profile.js"></script>
</body>
</html>
